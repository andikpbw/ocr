name: ocr
description: >-
  Modern, lightweight, zero-dependency Flutter OCR library for accurate offline
  text recognition, auto-deskew, entity extraction, and interactive UI overlays.
version: 1.0.0
homepage: https://github.com/andikpbw/ocr
repository: https://github.com/andikpbw/ocr
issue_tracker: https://github.com/andikpbw/ocr/issues
funding:
  - https://humanize.id

topics:
  - ocr
  - text-recognition
  - document-scanner
  - image-processing
  - computer-vision

screenshots:
  - description: Interactive Flutter OCR Studio showing live invoice recognition, confidence overlays, and extracted entities.
    path: doc/ocr_screenshot.png

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
